name: JIY bauen

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'   # jede Stunde: Kalender-Abo aktualisieren

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jiy-build-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # 1) Web-App auf GitHub Pages veröffentlichen (das sieht die App auf dem Handy)
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Kalender-Abo (ICS) aus Firebase holen
        env:
          ICS_TOKEN: ${{ secrets.ICS_TOKEN }}
        run: |
          if [ -z "$ICS_TOKEN" ]; then echo "Kein ICS_TOKEN – Kalender-Abo uebersprungen"; exit 0; fi
          mkdir -p web/cal
          if curl -sf "https://firestore.googleapis.com/v1/projects/jiy-family/databases/(default)/documents/ics/$ICS_TOKEN" -o doc.json; then
            python3 -c "import json,sys,re; t=sys.argv[1]; d=json.load(open('doc.json'))['fields']; open('web/cal/'+t+'.ics','w',newline='').write(d['ics']['stringValue']); [open('web/cal/'+t+'-'+k+'.ics','w',newline='').write(v['stringValue']) for k,v in d.get('per',{}).get('mapValue',{}).get('fields',{}).items() if re.fullmatch(r'[A-Za-z0-9_-]+',k)]" "$ICS_TOKEN"
            echo "Kalender-Abo aktualisiert"
          else
            echo "Noch kein Kalender in Firebase"
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v5

  # 2) Android-APK bauen und unter "Releases" bereitstellen
  apk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # Neue APK nur, wenn sich am Android-Teil etwas geändert hat (oder manuell gestartet)
      - name: Android geändert?
        id: chk
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git diff --quiet HEAD~1 HEAD -- android .github/workflows; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
          fi

      - if: steps.chk.outputs.build == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - if: steps.chk.outputs.build == 'true'
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      # Signier-Schlüssel kommt nur aus den GitHub-Secrets (nie im Repo speichern)
      - if: steps.chk.outputs.build == 'true'
        name: Signier-Schlüssel aus Secret holen
        env:
          KS: ${{ secrets.JIY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Secret JIY_KEYSTORE_BASE64 fehlt"; exit 1; fi
          printf '%s' "$KS" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/jiy.jks"
          echo "JIY_KEYSTORE=$RUNNER_TEMP/jiy.jks" >> "$GITHUB_ENV"

      - if: steps.chk.outputs.build == 'true'
        name: APK bauen
        env:
          JIY_APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          JIY_KEYSTORE_PASSWORD: ${{ secrets.JIY_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - if: always() && steps.chk.outputs.build == 'true'
        name: Schlüssel wieder löschen
        run: rm -f "$RUNNER_TEMP/jiy.jks"

      - if: steps.chk.outputs.build == 'true'
        name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk JIY-Family.apk

      - if: steps.chk.outputs.build == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: JIY-Family-APK
          path: JIY-Family.apk

      - if: steps.chk.outputs.build == 'true'
        name: Release "apk" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk JIY-Family.apk \
            --title "JIY Family App" \
            --notes "Neueste Version (Build ${{ github.run_number }}). Auf dem Handy herunterladen und installieren." \
            --latest
