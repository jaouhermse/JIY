name: JIY bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jiy-build
  cancel-in-progress: true

jobs:
  # 1) Web-App auf GitHub Pages veröffentlichen (das sieht die App auf dem Handy)
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  # 2) Android-APK bauen und unter "Releases" bereitstellen
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK bauen
        env:
          JIY_APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk JIY-Family.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JIY-Family-APK
          path: JIY-Family.apk

      - name: Release "apk" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk JIY-Family.apk \
            --title "JIY Family App" \
            --notes "Neueste Version (Build ${{ github.run_number }}). Auf dem Handy herunterladen und installieren." \
            --latest
