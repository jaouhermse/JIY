name: JIY bauen

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'   # jede Stunde: Kalender-Abo aktualisieren

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jiy-build-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # 1) Web-App auf GitHub Pages veröffentlichen (das sieht die App auf dem Handy)
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Kalender-Abo (ICS) aus Firebase holen
        env:
          ICS_TOKEN: ${{ secrets.ICS_TOKEN }}
        run: |
          if [ -z "$ICS_TOKEN" ]; then echo "Kein ICS_TOKEN – Kalender-Abo uebersprungen"; exit 0; fi
          mkdir -p web/cal
          if curl -sf "https://firestore.googleapis.com/v1/projects/jiy-family/databases/(default)/documents/ics/$ICS_TOKEN" -o doc.json; then
            python3 -c "import json,sys; d=json.load(open('doc.json')); open('web/cal/'+sys.argv[1]+'.ics','w',newline='').write(d['fields']['ics']['stringValue'])" "$ICS_TOKEN"
            echo "Kalender-Abo aktualisiert"
          else
            echo "Noch kein Kalender in Firebase"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  # 2) Android-APK bauen und unter "Releases" bereitstellen
  apk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK bauen
        env:
          JIY_APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk JIY-Family.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JIY-Family-APK
          path: JIY-Family.apk

      - name: Release "apk" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk JIY-Family.apk \
            --title "JIY Family App" \
            --notes "Neueste Version (Build ${{ github.run_number }}). Auf dem Handy herunterladen und installieren." \
            --latest
