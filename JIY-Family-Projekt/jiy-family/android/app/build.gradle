plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
// Adresse der Web-App (GitHub Pages). Wird beim Bauen auf GitHub automatisch gesetzt.
def appUrl = System.getenv("JIY_APP_URL") ?: "https://DEIN-GITHUB-NAME.github.io/jiy-family/"

android {
    namespace 'de.jiy.family'
    compileSdk 34

    defaultConfig {
        applicationId "de.jiy.family"
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0." + runNumber
        resValue "string", "app_url", appUrl
    }

    signingConfigs {
        jiy {
            storeFile file("jiy.keystore")
            storePassword "jiyfamily"
            keyAlias "jiy"
            keyPassword "jiyfamily"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.jiy
        }
        debug {
            signingConfig signingConfigs.jiy
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
