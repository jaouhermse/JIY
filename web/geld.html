<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Mein Geld</title>
<style>
:root{
  --bg:#f4f6f5;--card:#fff;--text:#14201c;--muted:#66756f;--line:#e2e8e5;
  --pri:#0f766e;--pri2:#14b8a6;--in:#15803d;--out:#c2410c;--warn:#b45309;--danger:#b91c1c;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
body.dark{--bg:#0d1412;--card:#16201d;--text:#e6efec;--muted:#93a39d;--line:#24322e;--pri:#2dd4bf;--pri2:#5eead4;--in:#4ade80;--out:#fb923c;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px}
header h1{font-size:20px;margin:0;flex:1}
.iconbtn{border:0;background:var(--card);color:var(--text);width:38px;height:38px;border-radius:12px;font-size:18px;box-shadow:var(--shadow)}
main{padding:4px 14px calc(100px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
.hero{background:linear-gradient(135deg,var(--pri),#155e75);color:#fff}
body.dark .hero{background:linear-gradient(135deg,#115e59,#164e63)}
.hero .big{font-size:32px;font-weight:700;margin:2px 0 12px}
.hero .row{display:flex;gap:10px}
.hero .row>div{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px}
.hero small{opacity:.85}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.muted{color:var(--muted)}
.in{color:var(--in)}.out{color:var(--out)}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.grow{flex:1;min-width:0}
.ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap;text-align:right}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--pri)}
.daylabel{font-size:12px;font-weight:700;color:var(--muted);margin:14px 2px 2px;text-transform:uppercase}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;border:0;background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
nav button span{font-size:20px}
nav button.on{color:var(--pri);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;border:0;background:var(--pri);color:#fff;font-size:30px;box-shadow:0 6px 20px rgba(15,118,110,.4);z-index:7}
body.dark .fab{color:#06201c}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:600;font-size:15px;background:var(--pri);color:#fff;cursor:pointer}
body.dark .btn{color:#06201c}
.btn.sec{background:var(--line);color:var(--text)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
body.dark .chip.on{color:#06201c}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:600;color:var(--muted);font-size:14px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.seg button.on.t-out{color:var(--out)}.seg button.on.t-in{color:var(--in)}.seg button.on.t-tr{color:var(--pri)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s}
.sheet h3{margin:0 0 6px;font-size:18px}
.sheet .actions{display:flex;gap:8px;margin-top:16px}
.sheet .actions .btn{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fade{from{opacity:0}}
.amountInput{font-size:30px;font-weight:700;text-align:center;padding:14px}
.catpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.catpick button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 2px;font-size:11.5px;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:2px;overflow:hidden}
.catpick button span{font-size:20px}
.catpick button.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,transparent)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14201c;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;animation:fade .2s}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.empty b{display:block;font-size:34px;margin-bottom:6px}
.flex{display:flex;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.legend div{display:flex;align-items:center;gap:6px;font-size:13px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.monthnav{display:flex;align-items:center;gap:8px;justify-content:center;margin:2px 0 10px}
.monthnav b{min-width:150px;text-align:center}
.pill{font-size:11px;padding:2px 7px;border-radius:8px;background:var(--line);color:var(--muted);margin-left:6px;font-weight:600}
.settingrow{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);gap:10px}
.settingrow:last-child{border:0}
.sync{font-size:11px;color:var(--muted)}
svg text{fill:var(--muted);font-size:10px}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.calc button{border:0;background:var(--bg);color:var(--text);padding:12px 0;border-radius:10px;font-size:18px;font-weight:600}
.calc button.op{color:var(--pri)}
.ai{background:linear-gradient(135deg,color-mix(in srgb,var(--pri) 14%,var(--card)),var(--card))}
.msg{padding:10px 12px;border-radius:14px;margin:8px 0;white-space:pre-wrap;line-height:1.45;font-size:14.5px}
.msg.u{background:var(--pri);color:#fff;margin-left:40px}
body.dark .msg.u{color:#06201c}
.msg.a{background:var(--bg);margin-right:20px}
.aibtn{border:1px dashed var(--pri);background:none;color:var(--pri);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
</style>
</head>
<body>
<header>
  <button class="iconbtn" id="btnBack" title="Zurück zu JIY" style="display:none">‹</button>
  <h1 id="title">Übersicht</h1>
  <span class="sync" id="sync"></span>
  <button class="iconbtn" id="btnAI" title="KI-Berater">✨</button>
  <button class="iconbtn" id="btnSearch" title="Suchen">🔍</button>
</header>
<main id="view"></main>
<button class="fab" id="fab" aria-label="Neue Buchung">+</button>
<nav id="nav">
  <button data-v="home" class="on"><span>🏠</span>Übersicht</button>
  <button data-v="tx"><span>📋</span>Buchungen</button>
  <button data-v="stats"><span>📊</span>Statistik</button>
  <button data-v="plan"><span>🎯</span>Planen</button>
  <button data-v="more"><span>⚙️</span>Mehr</button>
</nav>

<script>
(function(){
"use strict";
// ---------- Helpers ----------
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const ym=d=>d.slice(0,7);
const MONTHS=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const monthName=k=>{const[y,m]=k.split("-");return MONTHS[+m-1]+" "+y};
const addMonths=(k,n)=>{let[y,m]=k.split("-").map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+"-"+String(m).padStart(2,"0")};
const parseNum=v=>{if(typeof v==="number")return v;v=String(v||"").trim().replace(/\s/g,"");if(v.includes(",")){v=v.replace(/\./g,"").replace(",",".")}const n=parseFloat(v);return isNaN(n)?0:n};
const fmtDate=d=>{const x=new Date(d+"T00:00:00");return x.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"})};

// ---------- Default data ----------
const DEF_CATS=[
 {id:"c_food",name:"Lebensmittel",icon:"🛒",color:"#16a34a",type:"out"},
 {id:"c_rest",name:"Restaurant",icon:"🍽️",color:"#ea580c",type:"out"},
 {id:"c_home",name:"Miete & Wohnen",icon:"🏠",color:"#2563eb",type:"out"},
 {id:"c_energy",name:"Strom & Nebenk.",icon:"⚡",color:"#ca8a04",type:"out"},
 {id:"c_car",name:"Auto & Tanken",icon:"🚗",color:"#0891b2",type:"out"},
 {id:"c_transport",name:"ÖPNV & Reisen",icon:"✈️",color:"#0284c7",type:"out"},
 {id:"c_ins",name:"Versicherung",icon:"🛡️",color:"#4f46e5",type:"out"},
 {id:"c_phone",name:"Handy & Internet",icon:"📱",color:"#7c3aed",type:"out"},
 {id:"c_abo",name:"Abos",icon:"🔁",color:"#9333ea",type:"out"},
 {id:"c_shop",name:"Shopping",icon:"🛍️",color:"#db2777",type:"out"},
 {id:"c_kids",name:"Kinder",icon:"🧸",color:"#f43f5e",type:"out"},
 {id:"c_health",name:"Gesundheit",icon:"💊",color:"#dc2626",type:"out"},
 {id:"c_fun",name:"Freizeit",icon:"🎉",color:"#e11d48",type:"out"},
 {id:"c_edu",name:"Bildung",icon:"📚",color:"#65a30d",type:"out"},
 {id:"c_gift",name:"Geschenke",icon:"🎁",color:"#be185d",type:"out"},
 {id:"c_tax",name:"Steuern & Gebühren",icon:"🧾",color:"#57534e",type:"out"},
 {id:"c_other",name:"Sonstiges",icon:"📦",color:"#64748b",type:"out"},
 {id:"c_salary",name:"Gehalt",icon:"💼",color:"#15803d",type:"in"},
 {id:"c_biz",name:"Selbständig",icon:"🧑‍💻",color:"#0f766e",type:"in"},
 {id:"c_kg",name:"Kindergeld",icon:"👶",color:"#059669",type:"in"},
 {id:"c_refund",name:"Erstattung",icon:"↩️",color:"#0d9488",type:"in"},
 {id:"c_inother",name:"Sonst. Einnahme",icon:"💰",color:"#10b981",type:"in"}
];
const blank=()=>({v:1,currency:"€",dark:null,
 accounts:[{id:"a_giro",name:"Girokonto",icon:"🏦",start:0,archived:false},{id:"a_cash",name:"Bargeld",icon:"💶",start:0,archived:false}],
 cats:JSON.parse(JSON.stringify(DEF_CATS)),tx:[],budgets:{},recurring:[],goals:[],debts:[]});

let S=blank();
let ui={view:"home",month:ym(todayISO()),filter:{type:"all",acc:"all",cat:"all",q:""},statMonth:ym(todayISO())};
const fmt=n=>{const s=Math.abs(n).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2});return (n<0?"−":"")+s+" "+S.currency};

// ---------- JIY-Familienmodus (eingebettet in JIY Family) ----------
const JIY=(()=>{try{return window.parent!==window&&window.parent.JIYFin?window.parent.JIYFin:null}catch(e){return null}})();
let jiyLastTs=0,jiyCache={},jiyReloadT=null;
async function jiyLoad(){const main=await JIY.get("main");if(!main||!main.json)return false;const base=JSON.parse(main.json);let tx=[];jiyCache={};
 for(const y of (base.years||[])){const d=await JIY.get("tx-"+y);if(d&&d.json){jiyCache[y]=d.json;tx=tx.concat(JSON.parse(d.json))}}
 base.tx=tx;delete base.years;S=Object.assign(blank(),base);jiyLastTs=main.ts||0;saveLocal();return true}
async function jiyFlush(){const byY={};for(const t of S.tx){const y=String(t.date).slice(0,4);(byY[y]=byY[y]||[]).push(t)}
 const years=Object.keys(byY).sort();const ts=Date.now();jiyLastTs=ts;
 for(const y of years){const j=JSON.stringify(byY[y]);if(jiyCache[y]!==j){await JIY.set("tx-"+y,{json:j,ts});jiyCache[y]=j}}
 for(const y of Object.keys(jiyCache))if(!byY[y]){await JIY.set("tx-"+y,{json:"[]",ts});delete jiyCache[y]}
 const base=Object.assign({},S);delete base.tx;delete base.auth;base.years=years;base._ts=ts;
 await JIY.set("main",{json:JSON.stringify(base),ts,by:(JIY.me()||{}).name||""})}
async function initJIY(){setSync("verbinde …");
 try{const had=await jiyLoad();if(had){runRecurring();render()}else{await jiyFlush();toast("Familien-Haushaltsbuch angelegt ✓")}
  setSync("👨‍👩‍👦 Familie");
  JIY.watch("main",d=>{if(!d||!d.ts||d.ts===jiyLastTs||saving||pending)return;clearTimeout(jiyReloadT);jiyReloadT=setTimeout(async()=>{try{if(await jiyLoad()){render();toast("🔄 Aktualisiert"+(d.by?" von "+d.by:""))}}catch(e){}},700)});
 }catch(e){console.log(e);setSync("⚠️ keine Verbindung")}}

// ---------- Storage (Cloud-DB + lokaler Cache) ----------
const LS="meingeld_v1";
let db=null,docRef=null,saving=false,pending=false,saveTimer=null;
function setSync(t){$("#sync").textContent=t}
function loadLocal(){try{const r=localStorage.getItem(LS);if(r){S=Object.assign(blank(),JSON.parse(r))}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function persist(){saveLocal();if(!docRef&&!JIY){setSync("lokal");return}clearTimeout(saveTimer);saveTimer=setTimeout(flush,600);setSync("speichert…")}
async function flush(){if(!docRef&&!JIY)return;if(saving){pending=true;return}saving=true;
 try{if(JIY){await jiyFlush();setSync("👨‍👩‍👦 gesichert")}else{S._ts=Date.now();await docRef.set({json:JSON.stringify(S),ts:S._ts});setSync("☁️ gesichert")}}catch(e){setSync("⚠️ offline");console.log(e)}
 saving=false;if(pending){pending=false;flush()}}
async function initCloud(){
 if(JIY)return initJIY();
 try{
  if(!window.claude||!window.claude.use){setSync("lokal");return}
  const user=await claude.use("user");db=await claude.use("db");
  if(!db||!user){setSync("lokal");return}
  const id=await user.id();if(!id){setSync("lokal");return}
  docRef=db.doc("data/users/"+id+"/state/main");
  let done=false;const timer=setTimeout(()=>{if(!done)setSync("lokal")},10000);
  const snap=await docRef.get();done=true;clearTimeout(timer);
  let d=snap;if(d&&typeof d.data==="function")d=d.data();else if(d&&d.data&&typeof d.data==="object")d=d.data;
  if(d&&d.json){const remote=JSON.parse(d.json);if(!S._ts||(remote._ts||0)>=(S._ts||0)){S=Object.assign(blank(),remote);saveLocal();runRecurring();render();checkLock()}else flush()}
  else{flush()}
  setSync("☁️ gesichert");handleHashLogin();
 }catch(e){console.log(e);setSync("lokal")}
}

// ---------- Calculations ----------
const acc=id=>S.accounts.find(a=>a.id===id);
const cat=id=>S.cats.find(c=>c.id===id)||{name:"—",icon:"❔",color:"#94a3b8"};
function accBalance(id){const a=acc(id);let b=a?parseNum(a.start):0;for(const t of S.tx){if(t.type==="in"&&t.acc===id)b+=t.amount;else if(t.type==="out"&&t.acc===id)b-=t.amount;else if(t.type==="tr"){if(t.acc===id)b-=t.amount;if(t.to===id)b+=t.amount}}return b}
function totalBalance(){return S.accounts.filter(a=>!a.archived).reduce((s,a)=>s+accBalance(a.id),0)}
function monthSums(k){let i=0,o=0;for(const t of S.tx){if(ym(t.date)!==k)continue;if(t.type==="in")i+=t.amount;else if(t.type==="out")o+=t.amount}return{i,o}}
function catSpend(k,type="out"){const m={};for(const t of S.tx){if(ym(t.date)!==k||t.type!==type)continue;m[t.cat]=(m[t.cat]||0)+t.amount}return m}
function goalSaved(g){return (g.deposits||[]).reduce((s,d)=>s+d.amount,0)}
function debtLeft(d){return d.amount-(d.payments||[]).reduce((s,p)=>s+p.amount,0)}

// ---------- Recurring ----------
function nextDate(d,freq){const x=new Date(d+"T00:00:00");const day=x.getDate();
 if(freq==="week")x.setDate(x.getDate()+7);else if(freq==="2week")x.setDate(x.getDate()+14);
 else{const add=freq==="month"?1:freq==="quarter"?3:freq==="half"?6:12;x.setDate(1);x.setMonth(x.getMonth()+add);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last))}
 return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function runRecurring(){const today=todayISO();let n=0;
 for(const r of S.recurring){if(r.paused)continue;let guard=0;
  while(r.next<=today&&guard<120){if(r.end&&r.next>r.end){break}
   S.tx.push({id:uid(),type:r.type,amount:r.amount,acc:r.acc,to:r.to||null,cat:r.cat,date:r.next,note:r.note,tags:"",rec:r.id});n++;r.next=nextDate(r.next,r.freq);guard++}}
 if(n){persist();setTimeout(()=>toast(n+" Dauerauftrag-Buchung(en) automatisch erstellt"),400)}}

// ---------- UI primitives ----------
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
function sheet(html,onMount){const bg=document.createElement("div");bg.className="sheet-bg";bg.innerHTML='<div class="sheet">'+html+'</div>';
 bg.addEventListener("click",e=>{if(e.target===bg)close()});document.body.appendChild(bg);
 function close(){bg.remove()}if(onMount)onMount(bg.querySelector(".sheet"),close);return close}
function confirmBox(msg,yes,label="Löschen"){sheet(`<h3>Sicher?</h3><p class="muted">${esc(msg)}</p><div class="actions"><button class="btn sec" data-x>Abbrechen</button><button class="btn danger" data-y>${label}</button></div>`,(el,close)=>{el.querySelector("[data-x]").onclick=close;el.querySelector("[data-y]").onclick=()=>{close();yes()}})}
function icoBox(icon,color){return `<div class="ico" style="background:${color}22">${icon}</div>`}

// ---------- Charts (SVG) ----------
function donut(parts,size=130){const total=parts.reduce((s,p)=>s+p.v,0);if(!total)return"";let a=-Math.PI/2;const r=size/2-10,c=size/2;let out=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
 for(const p of parts){const ang=p.v/total*Math.PI*2;if(ang>=Math.PI*2-0.0001){out+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${p.c}" stroke-width="18"/>`;continue}
  const x1=c+r*Math.cos(a),y1=c+r*Math.sin(a);a+=ang;const x2=c+r*Math.cos(a),y2=c+r*Math.sin(a);
  out+=`<path d="M${x1} ${y1} A${r} ${r} 0 ${ang>Math.PI?1:0} 1 ${x2} ${y2}" fill="none" stroke="${p.c}" stroke-width="18"/>`;a+=0}
 return out+"</svg>"}
function bars(data,h=150){// data:[{l,i,o}]
 const w=Math.max(300,data.length*44),max=Math.max(1,...data.flatMap(d=>[d.i,d.o]));const bw=14,gap=w/data.length;
 let s=`<svg viewBox="0 0 ${w} ${h+20}" width="100%" preserveAspectRatio="none" style="max-height:200px">`;
 data.forEach((d,k)=>{const x=k*gap+gap/2;const hi=d.i/max*h,ho=d.o/max*h;
  s+=`<rect x="${x-bw-1}" y="${h-hi}" width="${bw}" height="${hi}" rx="3" fill="var(--in)"/><rect x="${x+1}" y="${h-ho}" width="${bw}" height="${ho}" rx="3" fill="var(--out)"/><text x="${x}" y="${h+14}" text-anchor="middle">${d.l}</text>`});
 return s+"</svg>"}
function line(points,h=120){if(points.length<2)return"";const w=320,min=Math.min(0,...points.map(p=>p.v)),max=Math.max(1,...points.map(p=>p.v));const sx=i=>i/(points.length-1)*(w-20)+10,sy=v=>h-((v-min)/(max-min||1))*(h-10)-5;
 const d=points.map((p,i)=>(i?"L":"M")+sx(i)+" "+sy(p.v)).join(" ");
 return `<svg viewBox="0 0 ${w} ${h+16}" width="100%"><line x1="0" x2="${w}" y1="${sy(0)}" y2="${sy(0)}" stroke="var(--line)"/><path d="${d}" fill="none" stroke="var(--pri)" stroke-width="2.5"/>${points.map((p,i)=>i%Math.ceil(points.length/6)===0||i===points.length-1?`<text x="${sx(i)}" y="${h+14}" text-anchor="middle">${p.l}</text>`:"").join("")}</svg>`}

V.stats=()=>{const k=ui.statMonth;const sp=catSpend(k),inc=catSpend(k,"in");const{i,o}=monthSums(k);

 let h=`<div class="monthnav"><button class="iconbtn" data-sm="-1">‹</button><b>${monthName(k)}</b><button class="iconbtn" data-sm="1">›</button></div>`;

 h+=`<button class="btn block" data-aistat style="margin-bottom:12px">✨ KI-Analyse dieses Monats</button>`;
 h+=`<div class="grid2"><div class="card"><h2>Sparquote</h2><b style="font-size:20px" class="${i-o>=0?"in":"out"}">${i?Math.round((i-o)/i*100):0}%</b><div class="sub">${fmt(i-o)} übrig</div></div><div class="card"><h2>vs. Vormonat</h2><b style="font-size:20px" class="${diff>0?"out":"in"}">${prev.o?(diff>0?"+":"")+diff.toFixed(0)+"%":"–"}</b><div class="sub">Ausgaben</div></div></div>`;
 h+=`<div class="card"><h2>Ausgaben nach Kategorie</h2>${parts.length?`<div class="flex" style="gap:14px;align-items:center">${donut(parts)}<div class="legend">${parts.slice(0,7).map(p=>`<div><i style="background:${p.c}"></i><span>${esc(cat(p.id).name)}</span><b>${Math.round(p.v/o*100)}%</b></div>`).join("")}</div></div>

 const ie=Object.entries(inc).sort((a,b)=>b[1]-a[1]);
 if(ie.length)h+=`<div class="card"><h2>Einnahmen nach Quelle</h2><ul class="list">${ie.map(([id,v])=>{const c=cat(id);return `<li class="item">${icoBox(c.icon,c.color)}<div class="grow ttl">${esc(c.name)}</div><div class="amt in">+${fmt(v)}</div></li>`}).join("")}</ul></div>`;

 const top=S.tx.filter(t=>t.type==="out"&&ym(t.date)===k).sort((a,b)=>b.amount-a.amount).slice(0,5);

 <div class="card" style="${NATIVE||JIY?"display:none":""}"><h2>Installieren auf Android</h2><div class="sub" style="white-space:normal">Seite in Chrome öffnen → Menü ⋮ → <b>„Zum Startbildschirm hinzufügen“</b>. Dann startet „Mein Geld“ wie eine App. Deine Daten werden in deinem Konto gesichert (☁️) und zusätzlich lokal.</div>
 <div class="sub" style="margin-top:8px">${S.tx.length} Buchungen · ${S.accounts.length} Konten · ${S.cats.length} Kategorien</div></div>`;

const TITLES={home:"Übersicht",tx:"Buchungen",stats:"Statistik",plan:"Planen",more:"Mehr",accounts:"Konten",cats:"Kategorien"};
function render(){const d=S.dark===null?matchMedia("(prefers-color-scheme: dark)").matches:S.dark;document.body.classList.toggle("dark",!!d);
 $("#title").textContent=TITLES[ui.view];$("#view").innerHTML=V[ui.view]();
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===ui.view||(ui.view==="accounts"||ui.view==="cats")&&b.dataset.v==="more"));
 bindView()}
function go(v){ui.view=v;try{if(location.hash!=="#"+v)history.replaceState(null,"","#"+v)}catch(e){}render();window.scrollTo(0,0)}

// ---------- Transaction editor ----------
function calcEval(s){s=String(s).replace(/,/g,".").replace(/[^0-9+\-*/.() ]/g,"");if(!s)return 0;try{const v=Function('"use strict";return ('+s+")")();return isFinite(v)?Math.round(v*100)/100:0}catch(e){return parseNum(s)}}
function txEditor(t,preset){const isNew=!t;t=t?{...t}:Object.assign({id:uid(),type:"out",amount:0,acc:(S.accounts.find(a=>!a.archived)||S.accounts[0]).id,to:null,cat:null,date:todayISO(),note:"",tags:""},preset||{});
 const accOpts=sel=>S.accounts.filter(a=>!a.archived||a.id===sel).map(a=>`<option value="${a.id}" ${a.id===sel?"selected":""}>${a.icon} ${esc(a.name)}</option>`).join("");
 const notes=[...new Set(S.tx.map(x=>x.note).filter(Boolean))].slice(-60);
 sheet(`<h3>${isNew?"Neue Buchung":"Buchung bearbeiten"}</h3>
 <div class="seg" id="seg"><button data-t="out" class="t-out">− Ausgabe</button><button data-t="in" class="t-in">+ Einnahme</button><button data-t="tr" class="t-tr">⇄ Umbuchung</button></div>
 <input id="amt" class="amountInput" inputmode="decimal" placeholder="0,00" value="${t.amount?String(t.amount).replace(".",","):""}" style="margin-top:10px">
 <div class="sub" style="text-align:center;margin-top:3px">Rechnen geht auch: z. B. 12,50+8,99</div>
 <div class="flex" id="aiRow" style="justify-content:center;margin-top:8px;display:none"><button class="aibtn" data-scan>📷 Beleg scannen</button><button class="aibtn" data-sug>✨ Kategorie vorschlagen</button></div>
 <input type="file" id="scanf" accept="image/*" capture="environment" style="display:none">
 <div id="catWrap"><label>Kategorie</label><div class="catpick" id="cp"></div></div>
 <div class="grid2"><div><label id="accL">Konto</label><select id="acc">${accOpts(t.acc)}</select></div><div id="toWrap"><label>Auf Konto</label><select id="to">${accOpts(t.to||"")}</select></div><div><label>Datum</label><input type="date" id="date" value="${t.date}"></div></div>
 <label>Notiz / Empfänger</label><input id="note" list="notes" value="${esc(t.note)}" placeholder="z. B. Rewe, Aldi, Tankstelle"><datalist id="notes">${notes.map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
 <label>Tags (optional)</label><input id="tags" value="${esc(t.tags||"")}" placeholder="z. B. urlaub, firma">
 ${isNew?`<label class="flex" style="margin-top:12px"><input type="checkbox" id="mkrec" style="width:auto"> Als Dauerauftrag (monatlich) anlegen</label>`:""}
 <div class="actions">${isNew?`<button class="btn sec" data-x>Abbrechen</button>`:`<button class="btn danger" data-del>Löschen</button><button class="btn sec" data-dup>Kopie</button>`}<button class="btn" data-save>Speichern</button></div>`,(el,close)=>{
  const q=s=>el.querySelector(s);
  function paint(){el.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.t===t.type));
   q("#catWrap").style.display=t.type==="tr"?"none":"";q("#toWrap").style.display=t.type==="tr"?"":"none";q("#accL").textContent=t.type==="tr"?"Von Konto":"Konto";
   const cs=S.cats.filter(c=>c.type===t.type);if(t.type!=="tr"&&!cs.find(c=>c.id===t.cat))t.cat=null;
   q("#cp").innerHTML=cs.map(c=>`<button data-c="${c.id}" class="${t.cat===c.id?"on":""}"><span>${c.icon}</span>${esc(c.name)}</button>`).join("")}
  paint();
  q("#seg").onclick=e=>{const b=e.target.closest("button");if(b){t.type=b.dataset.t;paint()}};
  q("#cp").onclick=e=>{const b=e.target.closest("button");if(b){t.cat=b.dataset.c;paint()}};
  q("#note").addEventListener("change",()=>{const prev=[...S.tx].reverse().find(x=>x.note===q("#note").value&&x.type===t.type);if(prev&&!t.cat){t.cat=prev.cat;paint()}});
  if(isNew)setTimeout(()=>q("#amt").focus(),250);
  getAI().then(ai=>{if(!ai)return;q("#aiRow").style.display="flex";
   q("[data-sug]").onclick=async()=>{const note=q("#note").value.trim();if(!note)return toast("Erst Notiz/Empfänger eingeben");const b=q("[data-sug]");b.textContent="✨ denkt…";
    try{const cs=S.cats.filter(c=>c.type===t.type);const r=await ai.json(`Ordne diese ${t.type==="in"?"Einnahme":"Ausgabe"} genau einer Kategorie zu. Buchung: "${note}", Betrag ${calcEval(q("#amt").value)} ${S.currency}. Kategorien (id: Name): ${cs.map(c=>c.id+": "+c.name).join(", ")}. Antworte nur als JSON {"cat":"<id>"}.`,{modelTier:"quick"});
     if(r&&cs.find(c=>c.id===r.cat)){t.cat=r.cat;paint();toast("Vorschlag: "+cat(r.cat).name)}else toast("Kein Vorschlag")}catch(e){aiErr(e)}b.textContent="✨ Kategorie vorschlagen"};
   q("[data-scan]").onclick=()=>q("#scanf").click();
   q("#scanf").onchange=async()=>{const f=q("#scanf").files[0];if(!f)return;const b=q("[data-scan]");b.textContent="📷 liest Beleg…";
    try{const lim=ai.limits?await ai.limits():{images:true};if(!lim||!lim.images){toast("Bilder werden hier nicht unterstützt");return}
     const cs=S.cats.filter(c=>c.type==="out");const r=await ai.json(`Lies diesen Kassenbon/Beleg. Gib JSON zurück: {"amount":Gesamtbetrag als Zahl,"date":"YYYY-MM-DD" oder null,"merchant":"Händlername","cat":"<id>"}. Kategorien: ${cs.map(c=>c.id+": "+c.name).join(", ")}. Heute ist ${todayISO()}.`,{images:[f],modelTier:"default"});
     if(r){t.type="out";if(r.amount)q("#amt").value=String(r.amount).replace(".",",");if(r.date&&/^\d{4}-\d{2}-\d{2}$/.test(r.date))q("#date").value=r.date;if(r.merchant)q("#note").value=r.merchant;if(cs.find(c=>c.id===r.cat))t.cat=r.cat;paint();toast("Beleg erkannt ✓ – bitte prüfen")}}
    catch(e){aiErr(e)}b.textContent="📷 Beleg scannen";q("#scanf").value=""};
  });
  const x=q("[data-x]");if(x)x.onclick=close;
  const del=q("[data-del]");if(del)del.onclick=()=>{close();confirmBox("Diese Buchung wird gelöscht.",()=>{S.tx=S.tx.filter(z=>z.id!==t.id);persist();render();toast("Gelöscht")})};
  const dup=q("[data-dup]");if(dup)dup.onclick=()=>{close();txEditor(null,{type:t.type,amount:t.amount,acc:t.acc,to:t.to,cat:t.cat,note:t.note,tags:t.tags})};
  q("[data-save]").onclick=()=>{t.amount=Math.abs(calcEval(q("#amt").value));t.acc=q("#acc").value;t.to=t.type==="tr"?q("#to").value:null;t.date=q("#date").value||todayISO();t.note=q("#note").value.trim();t.tags=q("#tags").value.trim().replace(/^#/,"");
   if(!t.amount)return toast("Bitte Betrag eingeben");
   if(t.type!=="tr"&&!t.cat)return toast("Bitte Kategorie wählen");
   if(t.type==="tr"){if(t.acc===t.to)return toast("Zwei verschiedene Konten wählen");t.cat=null}
   if(isNew&&JIY){const me=JIY.me();if(me&&me.name)t.by=me.name}
   const ix=S.tx.findIndex(z=>z.id===t.id);if(ix>=0)S.tx[ix]=t;else S.tx.push(t);
   if(isNew&&q("#mkrec")&&q("#mkrec").checked){S.recurring.push({id:uid(),type:t.type,amount:t.amount,acc:t.acc,to:t.to,cat:t.cat,note:t.note,freq:"month",next:nextDate(t.date,"month"),end:"",paused:false})}
   // Budget-Warnung
   if(t.type==="out"&&S.budgets[t.cat]){const u=catSpend(ym(t.date))[t.cat]||0;if(u>S.budgets[t.cat])setTimeout(()=>toast("⚠️ Budget "+cat(t.cat).name+" überschritten!"),300)}
   persist();close();render();toast(isNew?"Gespeichert ✓":"Aktualisiert ✓")};
 })}

// ---------- Other editors ----------
const EMOJIS="🛒🍽️🏠⚡🚗✈️🛡️📱🔁🛍️🧸💊🎉📚🎁🧾📦💼🧑‍💻👶↩️💰🐶☕🍺🚬💇🏋️🎮🎬🎵⛽🚕🚆🏥🦷👕👟💻🔧🧹🌿🎓💳🏦💶📈🪙🎯🏖️🎄💍⚽".match(/\p{Extended_Pictographic}(‍\p{Extended_Pictographic}|️)*/gu)||[];
const COLORS=["#16a34a","#ea580c","#2563eb","#ca8a04","#0891b2","#4f46e5","#7c3aed","#db2777","#dc2626","#64748b","#0f766e","#65a30d"];
function catEditor(c,type){const isNew=!c;c=c?{...c}:{id:"c_"+uid(),name:"",icon:"📦",color:COLORS[0],type};
 sheet(`<h3>${isNew?"Neue Kategorie":"Kategorie bearbeiten"}</h3><label>Name</label><input id="n" value="${esc(c.name)}">
 <label>Symbol</label><div class="chips" style="flex-wrap:wrap">${EMOJIS.map(e=>`<button class="chip ${c.icon===e?"on":""}" data-e="${e}">${e}</button>`).join("")}</div>
 <label>Farbe</label><div class="chips">${COLORS.map(x=>`<button class="chip ${c.color===x?"on":""}" data-col="${x}" style="background:${x};width:34px;height:30px"></button>`).join("")}</div>
 <div class="actions">${isNew?"":`<button class="btn danger" data-del>Löschen</button>`}<button class="btn" data-save>Speichern</button></div>`,(el,close)=>{
  el.onclick=e=>{const b=e.target.closest("[data-e],[data-col]");if(!b)return;if(b.dataset.e){c.icon=b.dataset.e;el.querySelectorAll("[data-e]").forEach(x=>x.classList.toggle("on",x===b))}else{c.color=b.dataset.col;el.querySelectorAll("[data-col]").forEach(x=>x.classList.toggle("on",x===b))}};
  const d=el.querySelector("[data-del]");if(d)d.onclick=()=>{const used=S.tx.some(t=>t.cat===c.id);if(used)return toast("Wird noch in Buchungen verwendet");close();S.cats=S.cats.filter(x=>x.id!==c.id);delete S.budgets[c.id];persist();render()};
  el.querySelector("[data-save]").onclick=()=>{c.name=el.querySelector("#n").value.trim();if(!c.name)return toast("Name fehlt");const ix=S.cats.findIndex(x=>x.id===c.id);if(ix>=0)S.cats[ix]=c;else S.cats.push(c);persist();close();render()}})}
function accEditor(a){const isNew=!a;a=a?{...a}:{id:"a_"+uid(),name:"",icon:"🏦",start:0,archived:false};
 sheet(`<h3>${isNew?"Neues Konto":"Konto bearbeiten"}</h3><label>Name</label><input id="n" value="${esc(a.name)}" placeholder="z. B. Sparkasse, PayPal, Kreditkarte">
 <label>Startsaldo (Kontostand bei Beginn)</label><input id="s" inputmode="decimal" value="${String(a.start).replace(".",",")}">
 <label>Symbol</label><div class="chips">${["🏦","💶","💳","🅿️","📈","🐷","🪙","💼"].map(e=>`<button class="chip ${a.icon===e?"on":""}" data-e="${e}">${e}</button>`).join("")}</div>
 ${isNew?"":`<label class="flex" style="margin-top:12px"><input type="checkbox" id="ar" style="width:auto" ${a.archived?"checked":""}> Archiviert (ausblenden)</label>
 <label>Aktueller Kontostand laut Bank (Abgleich)</label><div class="flex"><input id="real" inputmode="decimal" placeholder="${fmt(accBalance(a.id))}"><button class="btn sm sec" data-rec>Abgleichen</button></div>`}
 <div class="actions">${isNew?"":`<button class="btn danger" data-del>Löschen</button>`}<button class="btn" data-save>Speichern</button></div>`,(el,close)=>{
  el.onclick=e=>{const b=e.target.closest("[data-e]");if(b){a.icon=b.dataset.e;el.querySelectorAll("[data-e]").forEach(x=>x.classList.toggle("on",x===b))}};
  const rc=el.querySelector("[data-rec]");if(rc)rc.onclick=()=>{const real=parseNum(el.querySelector("#real").value);const diff=Math.round((real-accBalance(a.id))*100)/100;if(!diff)return toast("Stimmt bereits ✓");S.tx.push({id:uid(),type:diff>0?"in":"out",amount:Math.abs(diff),acc:a.id,cat:diff>0?"c_inother":"c_other",date:todayISO(),note:"Kontoabgleich",tags:""});persist();close();render();toast("Korrekturbuchung "+fmt(diff)+" erstellt")};
  const d=el.querySelector("[data-del]");if(d)d.onclick=()=>{if(S.tx.some(t=>t.acc===a.id||t.to===a.id))return toast("Konto hat Buchungen – lieber archivieren");if(S.accounts.length<2)return toast("Mindestens ein Konto nötig");close();S.accounts=S.accounts.filter(x=>x.id!==a.id);persist();render()};
  el.querySelector("[data-save]").onclick=()=>{a.name=el.querySelector("#n").value.trim();a.start=parseNum(el.querySelector("#s").value);const ar=el.querySelector("#ar");if(ar)a.archived=ar.checked;if(!a.name)return toast("Name fehlt");const ix=S.accounts.findIndex(x=>x.id===a.id);if(ix>=0)S.accounts[ix]=a;else S.accounts.push(a);persist();close();render()}})}
function budgetEditor(cid){const cs=S.cats.filter(c=>c.type==="out");cid=cid||cs[0].id;
 const avg=c=>{let s=0;for(let n=1;n<=3;n++){s+=catSpend(addMonths(ym(todayISO()),-n))[c]||0}return s/3};
 sheet(`<h3>Monatsbudget</h3><label>Kategorie</label><select id="c">${cs.map(c=>`<option value="${c.id}" ${c.id===cid?"selected":""}>${c.icon} ${esc(c.name)}</option>`).join("")}</select>
 <label>Limit pro Monat</label><input id="v" inputmode="decimal" value="${S.budgets[cid]?String(S.budgets[cid]).replace(".",","):""}"><div class="sub" id="hint" style="margin-top:4px"></div>
 <div class="actions"><button class="btn danger" data-del>Entfernen</button><button class="btn" data-save>Speichern</button></div>`,(el,close)=>{
  const hint=()=>{el.querySelector("#hint").textContent="Ø der letzten 3 Monate: "+fmt(avg(el.querySelector("#c").value))};hint();
  el.querySelector("#c").onchange=()=>{const c=el.querySelector("#c").value;el.querySelector("#v").value=S.budgets[c]?String(S.budgets[c]).replace(".",","):"";hint()};
  el.querySelector("[data-del]").onclick=()=>{delete S.budgets[el.querySelector("#c").value];persist();close();render()};
  el.querySelector("[data-save]").onclick=()=>{const v=parseNum(el.querySelector("#v").value);const c=el.querySelector("#c").value;if(v>0)S.budgets[c]=v;else delete S.budgets[c];persist();close();render()}})}
function recEditor(r){const isNew=!r;r=r?{...r}:{id:uid(),type:"out",amount:0,acc:S.accounts[0].id,to:null,cat:null,note:"",freq:"month",next:todayISO(),end:"",paused:false};
 const catOpts=()=>S.cats.filter(c=>c.type===r.type).map(c=>`<option value="${c.id}" ${c.id===r.cat?"selected":""}>${c.icon} ${esc(c.name)}</option>`).join("");
 sheet(`<h3>${isNew?"Neuer Dauerauftrag":"Dauerauftrag"}</h3>
 <div class="seg" id="seg"><button data-t="out" class="t-out">− Ausgabe</button><button data-t="in" class="t-in">+ Einnahme</button></div>
 <label>Bezeichnung</label><input id="n" value="${esc(r.note)}" placeholder="z. B. Miete, Netflix, Gehalt">
 <div class="grid2"><div><label>Betrag</label><input id="a" inputmode="decimal" value="${r.amount?String(r.amount).replace(".",","):""}"></div>
 <div><label>Rhythmus</label><select id="f">${[["week","Wöchentlich"],["2week","Alle 2 Wochen"],["month","Monatlich"],["quarter","Vierteljährlich"],["half","Halbjährlich"],["year","Jährlich"]].map(([v,l])=>`<option value="${v}" ${r.freq===v?"selected":""}>${l}</option>`).join("")}</select></div>
 <div><label>Kategorie</label><select id="c">${catOpts()}</select></div><div><label>Konto</label><select id="ac">${S.accounts.map(a=>`<option value="${a.id}" ${a.id===r.acc?"selected":""}>${esc(a.name)}</option>`).join("")}</select></div>
 <div><label>Nächste Ausführung</label><input type="date" id="nx" value="${r.next}"></div><div><label>Endet am (optional)</label><input type="date" id="e" value="${r.end||""}"></div></div>
 ${isNew?"":`<label class="flex" style="margin-top:12px"><input type="checkbox" id="p" style="width:auto" ${r.paused?"checked":""}> Pausiert</label>`}
 <div class="actions">${isNew?"":`<button class="btn danger" data-del>Löschen</button>`}<button class="btn" data-save>Speichern</button></div>`,(el,close)=>{
  const paint=()=>{el.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.t===r.type));el.querySelector("#c").innerHTML=catOpts()};paint();
  el.querySelector("#seg").onclick=e=>{const b=e.target.closest("button");if(b){r.type=b.dataset.t;r.cat=null;paint()}};
  const d=el.querySelector("[data-del]");if(d)d.onclick=()=>{close();confirmBox("Dauerauftrag löschen? Bereits gebuchte Einträge bleiben.",()=>{S.recurring=S.recurring.filter(x=>x.id!==r.id);persist();render()})};
  el.querySelector("[data-save]").onclick=()=>{r.note=el.querySelector("#n").value.trim();r.amount=Math.abs(calcEval(el.querySelector("#a").value));r.freq=el.querySelector("#f").value;r.cat=el.querySelector("#c").value;r.acc=el.querySelector("#ac").value;r.next=el.querySelector("#nx").value||todayISO();r.end=el.querySelector("#e").value;const p=el.querySelector("#p");if(p)r.paused=p.checked;
   if(!r.amount)return toast("Betrag fehlt");const ix=S.recurring.findIndex(x=>x.id===r.id);if(ix>=0)S.recurring[ix]=r;else S.recurring.push(r);runRecurring();persist();close();render()}})}
function goalEditor(g){const isNew=!g;g=g?JSON.parse(JSON.stringify(g)):{id:uid(),name:"",icon:"🎯",target:0,deadline:"",deposits:[]};
 sheet(`<h3>${isNew?"Neues Sparziel":esc(g.icon+" "+g.name)}</h3>
 ${isNew?"":`<div class="card" style="background:var(--bg);box-shadow:none"><b>${fmt(goalSaved(g))}</b> <span class="muted">von ${fmt(g.target)}</span><div class="flex" style="margin-top:8px"><input id="dep" inputmode="decimal" placeholder="Betrag"><button class="btn sm" data-dep="1">+ Einzahlen</button><button class="btn sm sec" data-dep="-1">− Entnehmen</button></div></div>`}
 <label>Name</label><input id="n" value="${esc(g.name)}" placeholder="z. B. Urlaub Tunesien">
 <div class="grid2"><div><label>Zielbetrag</label><input id="t" inputmode="decimal" value="${g.target?String(g.target).replace(".",","):""}"></div><div><label>Bis (optional)</label><input type="date" id="d" value="${g.deadline}"></div></div>
 <label>Symbol</label><div class="chips">${["🎯","🏖️","🚗","🏠","💍","🎓","🛟","💻","🎄","👶"].map(e=>`<button class="chip ${g.icon===e?"on":""}" data-e="${e}">${e}</button>`).join("")}</div>
 ${g.deposits.length?`<label>Verlauf</label><ul class="list">${g.deposits.slice().reverse().slice(0,8).map(d=>`<li class="item" style="cursor:default"><div class="grow sub">${new Date(d.date).toLocaleDateString("de-DE")}</div><div class="amt ${d.amount<0?"out":"in"}">${fmt(d.amount)}</div></li>`).join("")}</ul>`:""}
 <div class="actions">${isNew?"":`<button class="btn danger" data-del>Löschen</button>`}<button class="btn" data-save>Speichern</button></div>`,(el,close)=>{
  el.onclick=e=>{const b=e.target.closest("[data-e]");if(b){g.icon=b.dataset.e;el.querySelectorAll("[data-e]").forEach(x=>x.classList.toggle("on",x===b))}};
  el.querySelectorAll("[data-dep]").forEach(b=>b.onclick=()=>{const v=parseNum(el.querySelector("#dep").value);if(!v)return toast("Betrag eingeben");const real=S.goals.find(x=>x.id===g.id);real.deposits.push({amount:v*+b.dataset.dep,date:todayISO()});persist();close();render();if(goalSaved(real)>=real.target)toast("🎉 Sparziel erreicht!");else toast("Gespeichert ✓")});
  const d=el.querySelector("[data-del]");if(d)d.onclick=()=>{close();confirmBox("Sparziel löschen?",()=>{S.goals=S.goals.filter(x=>x.id!==g.id);persist();render()})};
  el.querySelector("[data-save]").onclick=()=>{g.name=el.querySelector("#n").value.trim();g.target=parseNum(el.querySelector("#t").value);g.deadline=el.querySelector("#d").value;if(!g.name||!g.target)return toast("Name und Betrag angeben");const ix=S.goals.findIndex(x=>x.id===g.id);if(ix>=0){g.deposits=S.goals[ix].deposits;S.goals[ix]=g}else S.goals.push(g);persist();close();render()}})}

 <h3 style="margin-top:16px">📝 Versionsverlauf</h3>${changelogHTML()}`,(el)=>{
  el.querySelector("#autoup").onchange=e=>lsSet("mg_autoupdate",e.target.value);
  el.querySelector("[data-check]").onclick=async()=>{const st=el.querySelector("#upst"),b=el.querySelector("[data-check]");b.disabled=true;b.textContent="Suche …";
   if(NATIVE){st.textContent="🔍 Prüfe GitHub …";await nativeUpdateCheck(st,false);b.disabled=false;b.textContent="Nach Updates suchen";return}
   st.textContent="🔍 Prüfe auf neue Version …";if(docRef){try{await flush()}catch(e){}}saveLocal();
   lsSet("mg_update_check",String(Date.now()));
   setTimeout(()=>{st.innerHTML="⬇️ Lade neueste Version … (Daten sind gesichert)";try{location.reload()}catch(e){}
    setTimeout(()=>{st.innerHTML="✅ Du hast die neueste Version <b>"+APP_VERSION+"</b>.";b.disabled=false;b.textContent="Nach Updates suchen"},2500)},600)}})}
const UPDATE_REPO="__GITHUB_REPO__";
async function nativeUpdateCheck(st,silent){if(UPDATE_REPO.startsWith("__")){if(st)st.textContent="Update-Quelle nicht eingerichtet.";return}
 try{const r=await fetch("https://api.github.com/repos/"+UPDATE_REPO+"/releases/latest",{headers:{Accept:"application/vnd.github+json"}});if(!r.ok)throw 0;const j=await r.json();
  const latest=parseInt(String(j.tag_name||"").replace(/\D/g,""))||0,cur=AndroidApp.versionCode();const apk=(j.assets||[]).find(a=>/\.apk$/i.test(a.name));
  if(latest>cur&&apk){const html=`🆕 <b>Update verfügbar!</b> Build ${latest} (du hast ${cur}).<div class="sub" style="white-space:pre-wrap;margin-top:4px">${esc((j.body||"").slice(0,400))}</div><button class="btn block" data-dl style="margin-top:10px">⬇️ Herunterladen & installieren</button><div class="sub" style="white-space:normal;margin-top:6px">Nach dem Download die APK antippen → „Aktualisieren“. Deine Daten bleiben erhalten.</div>`;
   const wire=root=>{root.querySelector("[data-dl]").onclick=()=>{saveLocal();AndroidApp.openUrl(apk.browser_download_url)}};
   if(silent||!st)sheet(`<h3>🔄 Update verfügbar</h3><div>${html}</div>`,el=>wire(el));else{st.innerHTML=html;wire(st)}}
  else if(st&&!silent)st.innerHTML="✅ Du hast die neueste Version (Build "+cur+")."}
 catch(e){if(st&&!silent)st.textContent="Keine Verbindung zu GitHub – später erneut versuchen."}}
function autoUpdateCheck(){if(NATIVE){if(lsGet("mg_autoupdate")!=="0"){const last=+lsGet("mg_native_check")||0;if(Date.now()-last>6*3600e3){lsSet("mg_native_check",String(Date.now()));setTimeout(()=>{if(!locked)nativeUpdateCheck(null,true)},2500)}}return}const last=+lsGet("mg_update_check")||0;lsSet("mg_update_check","0");
 if(last&&Date.now()-last<15000&&lsGet("mg_version")===APP_VERSION)setTimeout(()=>toast("✅ Du hast die neueste Version ("+APP_VERSION+")"),500)}

// ---------- Export / Import ----------
function csv(){const rows=[["Datum","Typ","Betrag","Konto","Zielkonto","Kategorie","Notiz","Tags"]];
 for(const t of sorted())rows.push([t.date,{in:"Einnahme",out:"Ausgabe",tr:"Umbuchung"}[t.type],String(t.amount).replace(".",","),(acc(t.acc)||{}).name||"",t.to?(acc(t.to)||{}).name||"":"",t.cat?cat(t.cat).name:"",t.note||"",t.tags||""]);
 return "﻿"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\r\n")}
async function exportData(kind){const data=kind==="csv"?csv():JSON.stringify(S,null,1);const filename="meingeld-"+todayISO()+"."+kind;
 if(NATIVE){const r=AndroidApp.saveFile(filename,data);if(r==="ok"){toast("📁 In „Downloads“ gespeichert: "+filename);return}}
 if(JIY&&JIY.saveFile){const r=JIY.saveFile(filename,data);if(r){toast("📁 Gespeichert: "+r);return}}
 let dl=null;try{dl=await claude.use("downloads")}catch(e){}
 if(dl){try{await dl.save({filename,data});toast("Datei gespeichert ✓");return}catch(e){}}
 sheet(`<h3>Export</h3><p class="sub" style="white-space:normal">Download nicht verfügbar – kopiere den Inhalt:</p><textarea rows="8" readonly>${esc(data)}</textarea><div class="actions"><button class="btn" data-c>Kopieren</button></div>`,(el)=>{el.querySelector("[data-c]").onclick=async()=>{try{await navigator.clipboard.writeText(data);toast("Kopiert ✓")}catch(e){el.querySelector("textarea").select();toast("Bitte manuell kopieren")}}})}
function importSheet(){sheet(`<h3>Importieren</h3><p class="sub" style="white-space:normal">JSON-Backup aus dieser App (ersetzt alle Daten) oder CSV mit Spalten Datum;Typ;Betrag;Konto;…;Kategorie;Notiz (wird hinzugefügt).</p><input type="file" id="f" accept=".json,.csv,text/csv,application/json"><label>…oder Inhalt einfügen</label><textarea id="txt" rows="5"></textarea><div class="actions"><button class="btn" data-go>Importieren</button></div>`,(el,close)=>{
 el.querySelector("[data-go]").onclick=async()=>{let txt=el.querySelector("#txt").value;const f=el.querySelector("#f").files[0];if(f)txt=await f.text();txt=txt.replace(/^﻿/,"").trim();if(!txt)return toast("Nichts zum Importieren");
  try{if(txt.startsWith("{")){const d=JSON.parse(txt);if(!d.tx||!d.accounts)throw 0;S=Object.assign(blank(),d);persist();close();render();toast("Backup wiederhergestellt ✓");return}
   const lines=txt.split(/\r?\n/).filter(Boolean);const sep=lines[0].includes(";")?";":",";const split=l=>{const out=[];let cur="",q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'&&l[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}else if(ch==='"')q=true;else if(ch===sep){out.push(cur);cur=""}else cur+=ch}out.push(cur);return out};
   let n=0;for(const l of lines.slice(1)){const c=split(l);let date=c[0];if(/^\d{1,2}\.\d{1,2}\.\d{4}$/.test(date)){const[d,m,y]=date.split(".");date=y+"-"+m.padStart(2,"0")+"-"+d.padStart(2,"0")}if(!/^\d{4}-\d{2}-\d{2}$/.test(date))continue;
    let amt=parseNum(c[2]);let type=/einn|in/i.test(c[1])?"in":/umb|tr/i.test(c[1])?"tr":"out";if(!c[1]){type=amt<0?"out":"in"}amt=Math.abs(amt);if(!amt)continue;
    const findAcc=name=>{let a=S.accounts.find(x=>x.name.toLowerCase()===String(name||"").toLowerCase());if(!a&&name){a={id:"a_"+uid(),name,icon:"🏦",start:0,archived:false};S.accounts.push(a)}return(a||S.accounts[0]).id};
    let cc=null;if(type!=="tr"){const cn=c[5]||"";cc=S.cats.find(x=>x.name.toLowerCase()===cn.toLowerCase()&&x.type===type);if(!cc&&cn){cc={id:"c_"+uid(),name:cn,icon:"📦",color:"#64748b",type};S.cats.push(cc)}if(!cc)cc=S.cats.find(x=>x.type===type)}
    S.tx.push({id:uid(),type,amount:amt,acc:findAcc(c[3]),to:type==="tr"?findAcc(c[4]):null,cat:cc?cc.id:null,date,note:c[6]||"",tags:c[7]||""});n++}
   persist();close();render();toast(n+" Buchungen importiert ✓")}catch(e){toast("Format nicht erkannt")}}})}
function demo(){const k=ym(todayISO());const add=(type,amount,cat,day,note,mOff=0,accId="a_giro")=>{const m=addMonths(k,-mOff);const d=m+"-"+String(Math.min(day,28)).padStart(2,"0");if(d>todayISO())return;S.tx.push({id:uid(),type,amount,acc:accId,cat,date:d,note,tags:""})};
 for(let m=0;m<6;m++){add("in",3200,"c_salary",1,"Gehalt",m);add("in",255,"c_kg",5,"Kindergeld",m);add("out",1150,"c_home",1,"Miete",m);add("out",95,"c_energy",3,"Stadtwerke",m);add("out",39.99,"c_phone",8,"Telekom",m);add("out",13.99,"c_abo",12,"Netflix",m);
  for(let w=0;w<4;w++){add("out",+(45+Math.random()*60).toFixed(2),"c_food",2+w*7,["Rewe","Aldi","Lidl","Edeka"][w],m);add("out",+(50+Math.random()*30).toFixed(2),"c_car",4+w*7,"Tankstelle",m)}
  add("out",+(30+Math.random()*90).toFixed(2),"c_rest",14,"Pizzeria",m);add("out",+(20+Math.random()*120).toFixed(2),"c_shop",18,"Amazon",m);add("out",+(15+Math.random()*40).toFixed(2),"c_kids",20,"Spielzeug",m);add("out",+(10+Math.random()*40).toFixed(2),"c_fun",22,"Kino",m,"a_cash")}
 S.budgets={c_food:450,c_rest:120,c_shop:150,c_car:280};S.accounts[0].start=1500;S.accounts[1].start=200;
 S.goals.push({id:uid(),name:"Urlaub",icon:"🏖️",target:2500,deadline:addMonths(k,6)+"-01",deposits:[{amount:600,date:todayISO()}]});
 S.recurring.push({id:uid(),type:"out",amount:13.99,acc:"a_giro",cat:"c_abo",note:"Netflix",freq:"month",next:nextDate(k+"-12","month"),end:"",paused:false});
 persist();render();toast("Beispieldaten geladen")}

// ---------- Bindings ----------
function bindView(){const v=$("#view");
 v.onclick=e=>{const el=e.target.closest("[data-tx],[data-go],[data-acc],[data-rec],[data-addbudget],[data-budget],[data-addrec],[data-addgoal],[data-goal],[data-adddebt],[data-debt],[data-addacc],[data-editacc],[data-transfer],[data-addcat],[data-editcat],[data-export],[data-import],[data-reset],[data-demo],[data-calc],[data-ft],[data-fm],[data-m],[data-sm],[data-statcat],[data-ai],[data-aitip],[data-aistat],[data-stmt],[data-lock],[data-qr],[data-logout],[data-update],[data-key]");if(el&&"key" in el.dataset)return keySheet();if(el&&"update" in el.dataset)return updateSheet();if(!el)return;const d=el.dataset;
  if("stmt" in d)return statementSheet();if("lock" in d)return lockSetup();if("qr" in d)return qrSheet();if("logout" in d){setUnlocked(false);locked=true;return showLock()}
  if("ai" in d)return aiSheet();if("aitip" in d)return aiTip();if("aistat" in d)return aiSheet("Analysiere meine Ausgaben im "+monthName(ui.statMonth)+" und sag mir, wo ich am meisten sparen kann.");
  if(d.tx)txEditor(S.tx.find(t=>t.id===d.tx));
  else if(d.go)go(d.go);
  else if(d.acc){ui.filter={type:"all",acc:d.acc,cat:"all",q:"",month:"all"};go("tx")}
  else if(d.rec)recEditor(S.recurring.find(r=>r.id===d.rec));
  else if("addbudget" in d)budgetEditor();else if(d.budget)budgetEditor(d.budget);
  else if("addrec" in d)recEditor();else if("addgoal" in d)goalEditor();else if(d.goal)goalEditor(S.goals.find(g=>g.id===d.goal));
  else if("adddebt" in d)debtEditor();else if(d.debt)debtEditor(S.debts.find(x=>x.id===d.debt));
  else if("addacc" in d)accEditor();else if(d.editacc)accEditor(acc(d.editacc));
  else if("transfer" in d)txEditor(null,{type:"tr",to:(S.accounts[1]||S.accounts[0]).id});
  else if(d.addcat)catEditor(null,d.addcat);else if(d.editcat)catEditor(S.cats.find(c=>c.id===d.editcat));
  else if(d.export)exportData(d.export);else if("import" in d)importSheet();else if("calc" in d)calcSheet();
  else if("demo" in d)confirmBox("Es werden Beispiel-Buchungen der letzten 6 Monate hinzugefügt.",demo,"Laden");
  else if("reset" in d)confirmBox("ALLE Buchungen, Konten, Ziele werden gelöscht. Vorher ein Backup machen!",()=>{S=blank();persist();render();toast("Zurückgesetzt")});
  else if(d.ft){ui.filter.type=d.ft;render()}
  else if("fm" in d){ui.filter.month=ui.filter.month==="all"?"":"all";render()}
  else if(d.m){ui.filter.month="";ui.month=addMonths(ui.month,+d.m);render()}
  else if(d.sm){ui.statMonth=addMonths(ui.statMonth,+d.sm);render()}
  else if(d.statcat){ui.filter={type:"out",acc:"all",cat:d.statcat,q:"",month:""};ui.month=ui.statMonth;go("tx")}
 };
 const q=$("#q");if(q){q.oninput=()=>{ui.filter.q=q.value;clearTimeout(q._t);q._t=setTimeout(()=>{const pos=q.selectionStart;render();const n=$("#q");n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}},250)}}
 const fa=$("#facc");if(fa)fa.onchange=()=>{ui.filter.acc=fa.value;render()};
 const fc=$("#fcat");if(fc)fc.onchange=()=>{ui.filter.cat=fc.value;render()};
 const ds=$("#darkSel");if(ds)ds.onchange=()=>{S.dark=ds.value==="auto"?null:ds.value==="1";persist();render()};
 const cs=$("#curSel");if(cs)cs.onchange=()=>{S.currency=cs.value;persist();render()};
}

if(JIY){$("#btnBack").style.display="";$("#btnBack").onclick=()=>JIY.close();$("#btnSearch").style.display="none"}
